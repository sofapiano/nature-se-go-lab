syntax = "proto3";

package github.com.igoroutine_courses.microservices.ecommerce.cart.v1;
option go_package = "github.com/igoroutine-courses/microservices.ecommerce.pkg/generated/cart/api/cart/v1;cart";

import "google/protobuf/empty.proto";
import "buf/validate/validate.proto";

service Cart {
  rpc AddItem(AddItemRequest) returns (google.protobuf.Empty);
  rpc DeleteItem(DeleteItemRequest) returns (google.protobuf.Empty);
  rpc ListCart(ListCartRequest) returns (ListCartResponse);
  rpc ClearCart(ClearCartRequest) returns (google.protobuf.Empty);
  rpc CheckoutCart(CheckoutCartRequest) returns (CheckoutCartResponse);
  rpc SetItemQuantity(SetItemQuantityRequest) returns (google.protobuf.Empty);
}

message Item {
  string sku = 1 [json_name = "sku"];
  uint32 count = 2 [json_name = "count"];
  string name = 3 [json_name = "name"];
  uint32 price = 4 [json_name = "price"];
}

message AddItemRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
  string sku = 2 [json_name = "sku", (buf.validate.field).string = {min_len: 1, max_len: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}];
  uint32 count = 3 [json_name = "count", (buf.validate.field).uint32 = {gte: 1, lte: 1000}];
}

message DeleteItemRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
  string sku = 2 [json_name = "sku", (buf.validate.field).string = {min_len: 1, max_len: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}];
}

message ListCartRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
}

message ListCartResponse {
  repeated Item items = 1 [json_name = "items"];
  uint32 total_price = 2 [json_name = "total_price"];
}

message ClearCartRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
}

message CheckoutCartRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
  string request_id = 2 [json_name = "request_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
}

message CheckoutCartResponse {
  string order_id = 1 [json_name = "order_id"];
}

message SetItemQuantityRequest {
  string user_id = 1 [json_name = "user_id", (buf.validate.field).string = {uuid: true, pattern: "(?i)^.{14}7.{4}[89ab]"}];
  string sku = 2 [json_name = "sku", (buf.validate.field).string = {min_len: 1, max_len: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"}];
  uint32 count = 3 [json_name = "count", (buf.validate.field).uint32 = {gte: 1, lte: 1000}];
}