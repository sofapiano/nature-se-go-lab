version: "3"

vars:
  LOCAL_BIN: '{{.ROOT_DIR}}/bin'
  EASYP_BIN: "{{.LOCAL_BIN}}/easyp"
  GOIMPORTS_BIN: "{{.LOCAL_BIN}}/goimports"
  GOLANGCI_LINT_VERSION: 'v2.14.0'
  GO_SERVICES_MODULES: "cart loms notifier gateway"

tasks:
  up:
    docker-compose -f docker-compose.yml up --build -d

  down:
    docker-compose -f docker-compose.yml down -v --remove-orphans || true

  test:
    desc: "Run all tests"
    cmds:
      - |
        docker-compose \
          -f docker-compose.ci.yml \
          -f docker-compose.test.yml \
          down -v --remove-orphans || true

        docker-compose \
          -f docker-compose.ci.yml \
          -f docker-compose.test.yml \
          up \
          --build \
          --abort-on-container-exit \
          --exit-code-from integration-tests

  update:
    desc: "Update tests"
    requires:
      vars: [ hw ]
    cmds:
      - go run .github/update.go -hw {{.hw}}

  force-update:
    desc: "Force update tests"
    aliases: [ "force_update", "fu" ]
    requires:
      vars: [ hw ]
    cmds:
      - go run .github/update.go -force -hw {{.hw}}

  lint:
    desc: "Run golangci-lint"
    cmds:
      - |
        GO_BUILD_VERSION="$(go env GOVERSION)"
        if [ "${OS:-}" = "Windows_NT" ]; then
          LINT="{{.LOCAL_BIN}}/golangci-lint.exe"
        
          if [ ! -f "$LINT" ] || ! "$LINT" version | grep -q '{{trimPrefix "v" .GOLANGCI_LINT_VERSION}}' || ! "$LINT" version | grep -q "$GO_BUILD_VERSION"; then
            echo "golangci-lint not found. Installing..."
            mkdir -p "{{.LOCAL_BIN}}"
            GOTOOLCHAIN="$GO_BUILD_VERSION" GOBIN="{{.LOCAL_BIN}}" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
          fi
        
          echo "Running golangci-lint..."
          for mod in {{.GO_SERVICES_MODULES}}; do
            echo " -> $mod"
            (
              cd "$mod"
              "$LINT" run --config=../.golangci.yaml
            )
          done
        else 
          if [ ! -x "{{.LOCAL_BIN}}/golangci-lint" ] || ! "{{.LOCAL_BIN}}/golangci-lint" version | grep -q '{{trimPrefix "v" .GOLANGCI_LINT_VERSION}}' || ! "{{.LOCAL_BIN}}/golangci-lint" version | grep -q "$GO_BUILD_VERSION"; then
            echo "golangci-lint not found. Installing..."
            mkdir -p "{{.LOCAL_BIN}}"
            GOTOOLCHAIN="$GO_BUILD_VERSION" GOBIN="{{.LOCAL_BIN}}" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
          fi
        
          echo "Running golangci-lint..."
          for mod in {{.GO_SERVICES_MODULES}}; do
            echo " -> $mod"
            (
              cd "$mod"
              "{{.LOCAL_BIN}}/golangci-lint" run --config=../.golangci.yaml
            )
          done
        fi

  repo-update:
    desc: "Sync repository"
    cmds:
      - |
        set -euo pipefail

        if [ -n "$(git status --untracked-files=no --porcelain)" ]; then
          echo 'You have some changes. Please commit, checkout or stash them.'
          exit 1
        fi

        current_branch="$(git branch --show-current)"
        echo "Current branch: $current_branch"

        git checkout main
        git pull

        for branch in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
          git checkout "$branch"

          if ! git rev-parse --symbolic-full-name @{u} >/dev/null 2>&1; then
            if git ls-remote --heads origin "$branch" | grep -q .; then
              echo "Upstream exists for $branch. Setting upstream to origin/$branch."
              git branch --set-upstream-to="origin/$branch"
            else
              echo "Upstream not found for $branch. Pushing and setting upstream to origin/$branch."
              git push --set-upstream origin "$branch"
              git branch --set-upstream-to="origin/$branch"
            fi
          fi

          git pull --rebase
          git push -f
          git rebase main
          git push -f
        done

        git checkout "$current_branch"
        echo 'Successfully updated'

  build:
    desc: Build Go service modules
    cmds:
      - |
        set -eu
        for mod in {{.GO_SERVICES_MODULES}} pkg; do
          go build ./$mod/...
        done

  create-bin:
    internal: true
    desc: Ensure ./bin exists
    cmds:
      - mkdir -p ./bin

  bin-deps:
    desc: Install local Go tools into ./bin (LOCAL_BIN)
    deps: [create-bin]
    env:
      GOBIN: "{{.LOCAL_BIN}}"
    cmds:
      - go install github.com/easyp-tech/easyp/cmd/easyp@v0.12.4
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.1
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.2.0
      - go install golang.org/x/tools/cmd/goimports@v0.19.0
      - go install go.uber.org/mock/mockgen@latest

  fast-generate:
    desc: Generate code (assumes deps already installed)
    cmds:
      - task: _generate

  billing-generate:
    desc: Generate Billing Java messages and gRPC via EasyP built-in WASM plugins
    cmds:
      - rm -rf ./billing/target/generated-sources/protobuf
      - 'EASYP_TARGET=java "{{.EASYP_BIN}}" --cfg easyp.yaml generate'

  generate:
    desc: Install deps + generate code
    deps: [bin-deps]
    cmds:
      - task: _generate

  _generate:
    internal: true
    desc: easyp generate + goimports
    cmds:
      - echo "Generating code..."
      - rm -rf ./pkg/generated && mkdir -p ./pkg/generated
      - rm -rf ./docs/spec
      - |
        set -euo pipefail
        EASYP_TARGET=go PATH="{{.LOCAL_BIN}}:${PATH}" \
          "{{.EASYP_BIN}}" mod download
      - |
        set -euo pipefail
        EASYP_TARGET=go PATH="{{.LOCAL_BIN}}:${PATH}" \
          "{{.EASYP_BIN}}" generate
      - task: billing-generate
      - |
        echo "Running go generate in workspace modules..."
        go work edit -json | jq -r '.Use[].DiskPath' | while IFS= read -r mod; do
          echo " -> $mod"
          (
            cd "$mod"
            export PATH="{{.LOCAL_BIN}}:${PATH}"
            export GOBIN="{{.LOCAL_BIN}}"
            go generate ./...
            go mod tidy
          )
        done

  frontend:
    desc: "Run frontend"
    cmds:
      - |
        (cd ./frontend && npm install && npm run dev)

  backend:
    desc: "Run backend"
    cmds:
      - |
        docker-compose \
          -f docker-compose.yml \
          down -v --remove-orphans || true

        docker-compose -f docker-compose.yml up --build
